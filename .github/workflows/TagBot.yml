name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Deploy key created with DocumenterTools.genkeys. TagBot pushes tags over
          # SSH, so tags trigger other workflows and commits that change workflow
          # files can still be tagged (their releases must be created by hand).
          ssh: ${{ secrets.DOCUMENTER_KEY }}
